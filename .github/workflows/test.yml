name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x64
            id: ubuntu-24.04-x64
            os: ubuntu-24.04
          - name: Windows Server 2025 x64
            id: windows-2025-x64
            os: windows-2025
          - name: macOS 15 ARM64
            id: macos-15-arm64
            os: macos-15

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Check build logic
        run: ./gradlew -p buildSrc check --no-daemon --console=plain --stacktrace --warning-mode all

      - name: Run project checks
        run: ./gradlew check --no-daemon --console=plain --stacktrace --warning-mode all

      - name: Verify diagnostic evidence
        if: always()
        shell: pwsh
        run: |
          $requiredPaths = @(
            "build/reports/architecture/report.json",
            "build/reports/architecture/report.md",
            "buildSrc/build/test-results/test",
            "krig-model/build/reports/detekt/detekt.sarif"
          )
          $missingPaths = @($requiredPaths | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missingPaths.Count -ne 0) {
            throw "Required verification evidence is missing: $($missingPaths -join ', ')"
          }
          $architectureStatus = (Get-Content -Raw -LiteralPath $requiredPaths[0] | ConvertFrom-Json).status
          if ($architectureStatus -ne "PASS") {
            throw "Architecture report status is '$architectureStatus', expected 'PASS'"
          }
          $buildLogicTestResults = @(Get-ChildItem -LiteralPath $requiredPaths[2] -File -Filter "TEST-*.xml")
          if ($buildLogicTestResults.Count -eq 0) {
            throw "No build-logic JUnit XML results were produced"
          }

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            build/reports/architecture/**
            build/reports/problems/**
            buildSrc/build/test-results/**
            buildSrc/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/detekt/**
          if-no-files-found: error
          retention-days: 7
