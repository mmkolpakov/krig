name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x64
            id: ubuntu-24.04-x64
            os: ubuntu-24.04
          - name: Windows Server 2025 x64
            id: windows-2025-x64
            os: windows-2025
          - name: macOS 15 ARM64
            id: macos-15-arm64
            os: macos-15

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Check build logic
        run: ./gradlew -p buildSrc check --no-daemon --console=plain --stacktrace --warning-mode all

      - name: Run project checks
        run: ./gradlew check --no-daemon --console=plain --stacktrace --warning-mode all

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 7
