name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate common KSP sources
        run: ./gradlew :krig-model:kspCommonMainKotlinMetadata --no-daemon --console=plain

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: |
            --linter qodana-jvm-community
            --within-docker false
            --clear-cache
          pr-mode: false
          use-caches: false
          post-pr-comment: true
          use-annotations: true
          upload-result: true
          push-fixes: 'none'
