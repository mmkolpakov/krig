name: Qodana

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Generate common KSP sources
        run: ./gradlew :krig-model:kspCommonMainKotlinMetadata --no-daemon --console=plain

      - name: Run Qodana
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # v2026.1.3
        with:
          args: >-
            --within-docker false
            --print-problems
            --timeout 3600000
            --timeout-exit-code 124
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          cache-default-branch-only: true
          primary-cache-key: qodana-2026.1.3-${{ runner.os }}-${{ github.sha }}
          additional-cache-key: qodana-2026.1.3-${{ runner.os }}-${{ github.sha }}-no-cross-revision-fallback
          upload-result: true
          artifact-name: qodana-${{ github.event_name }}-${{ github.sha }}-${{ github.run_attempt }}
          post-pr-comment: false
          use-annotations: false
          push-fixes: none
