#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#
version: "1.0"
linter: qodana-jvm-community

profile:
  name: Default

include:
  - name: UnusedSymbol

exclude:
  - name: UnnecessaryModuleDependencyInspection
  - name: unused
  - name: UnusedReceiverParameter
  - name: SameParameterValue
  - name: SameReturnValue
  - name: UnusedSymbol
    paths:
      - krig-ksp-processor/src/test/kotlin/space/kscience/krig/ksp/PipelineFeatureSpecContractValidatorTest.kt
      - krig-ksp-processor/src/test/kotlin/space/kscience/krig/ksp/KspIncrementalRegressionTest.kt
      - krig-ksp-processor/src/test/kotlin/space/kscience/krig/ksp/SerializersModuleGeneratorTest.kt
  - name: All
    paths:
      - build
      - buildSrc/build
      - krig-assembly/build
      - krig-contracts/build
      - krig-demo/build
      - krig-identity/build
      - krig-io/build
      - krig-jupyter/build
      - krig-ksp-processor/build
      - krig-magix/build
      - krig-messaging/build
      - krig-model/build
      - krig-runtime-stdlib/build
      - krig-runtime/build
      - krig-simulation/build
      - krig-state/build
      - .gradle
      - .kotlin
      - .qodana
      - generated
      - cache

projectJDK: "21"

failureConditions:
  severityThresholds:
    critical: 0
    high: 0
