[versions]
kotlin = "2.4.0-RC2"

# Core runtime
atomicfu = "0.32.1"
dataforge = "0.11.0-dev-2"
kmath = "0.5.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.10.0"
kotlinx-io-core = "0.9.0"
attributes-kt = "0.4.0"
slf4j = "2.0.18"
h2 = "2.4.240"
postgresql = "42.7.11"
testcontainers = "2.0.5"
exposed = "1.1.1"

# Immutable collections
kotlinx-collections-immutable = "0.4.0"

# Testing
turbine = "1.2.1"

# Code Generation (used by krig-ksp-processor + buildSrc convention plugin)
ksp = "2.3.9"
kctfork = "0.13.0-alpha01"

# Static Analysis
detekt = "2.0.0-alpha.3"

# Documentation
dokka = "2.2.0"

# Benchmarking
kotlinx-benchmark = "0.4.17"

# Analytics interop (JVM-only): Apache Arrow Java for Arrow IPC / Feather V2 export
arrow = "18.3.0"

# Jupyter
kotlin-jupyter = "0.19.0-937-1"

# Gradle Plugins
ben-manes-versions = "0.54.0"
version-catalog-update = "1.0.1"
foojay-resolver = "1.0.0"

[libraries]
# DataForge
dataforge-io = { module = "space.kscience:dataforge-io", version.ref = "dataforge" }
dataforge-meta = { module = "space.kscience:dataforge-meta", version.ref = "dataforge" }
dataforge-context = { module = "space.kscience:dataforge-context", version.ref = "dataforge" }
dataforge-data = { module = "space.kscience:dataforge-data", version.ref = "dataforge" }
tables-kt = { module = "space.kscience:tables-kt", version.ref = "dataforge" }

# KMath (numeric Data Plane: typed buffers / SoA structures / algebras)
kmath-core = { module = "space.kscience:kmath-core", version.ref = "kmath" }
kmath-coroutines = { module = "space.kscience:kmath-coroutines", version.ref = "kmath" }
kmath-functions = { module = "space.kscience:kmath-functions", version.ref = "kmath" }

# kscience
attributes-kt = { module = "space.kscience:attributes-kt", version.ref = "attributes-kt" }
attributes-kt-serialization = { module = "space.kscience:attributes-kt-serialization", version.ref = "attributes-kt" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }

# Kotlin compiler plugins for buildSrc
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlin-power-assert-plugin = { module = "org.jetbrains.kotlin:kotlin-power-assert", version.ref = "kotlin" }

# Gradle plugins for buildSrc
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }

# KotlinX
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io-core" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinx-benchmark" }

# Storage bench
h2 = { module = "com.h2database:h2", version.ref = "h2" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }

# Apache Arrow (JVM-only, krig-arrow)
arrow-vector = { module = "org.apache.arrow:arrow-vector", version.ref = "arrow" }
arrow-memory-netty = { module = "org.apache.arrow:arrow-memory-netty", version.ref = "arrow" }
arrow-compression = { module = "org.apache.arrow:arrow-compression", version.ref = "arrow" }

# Testing
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# KSP
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
ksp-aa-embeddable = { module = "com.google.devtools.ksp:symbol-processing-aa-embeddable", version.ref = "ksp" }
kctfork-core = { module = "dev.zacsweers.kctfork:core", version.ref = "kctfork" }
kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }

# Jupyter
kotlin-jupyter-api = { module = "org.jetbrains.kotlinx:kotlin-jupyter-api", version.ref = "kotlin-jupyter" }

[plugins]
kotlinx-atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "atomicfu" }

ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "ben-manes-versions" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinx-benchmark" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
